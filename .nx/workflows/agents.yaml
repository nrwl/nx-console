common-env: &common-env
  NX_VERBOSE_LOGGING: true
  NX_PLUGIN_NO_TIMEOUTS: true
  # Record and hash tasks with Nx Cloud I/O snapshots (ultracache).
  NX_CLOUD_USE_ULTRACACHE: 'true'
  # Eclipse Temurin release that "Setup Java" installs, as named on https://adoptium.net/temurin/releases.
  JDK_VERSION: '21.0.13+9'
common-init-steps: &common-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/checkout/main.yaml'
  - group-name: Restore Caches
    steps:
      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml'
          paths: 'node_modules'
          base-branch: 'master'
      # Gradle tasks otherwise download the wrapper distribution from services.gradle.org on every
      # agent, and fail when that download times out.
      - name: Restore Gradle Wrapper Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'gradle/wrapper/gradle-wrapper.properties|"gradle-wrapper-dists"'
          paths: '~/.gradle/wrapper/dists'
          base-branch: 'master'
      - name: Restore Browser Binary Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"'
          paths: |
            '../.cache/Cypress'
          base-branch: 'master'
      - name: Restore Java Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: '.nx/workflows/agents.yaml|"jdk"'
          paths: '~/.cache/jdk'
          base-branch: 'master'
  # The JDK is a cached Temurin tarball rather than an apt package: apt mirrors are at times slow enough
  # to stretch this step to minutes. It still runs next to the node_modules install.
  - group-name: Install Dependencies
    parallel: true
    steps:
      - name: Setup Java
        script: |
          set -euo pipefail
          export JAVA_HOME="$HOME/.cache/jdk"
          if ! grep -qsF "JAVA_RUNTIME_VERSION=\"$JDK_VERSION" "$JAVA_HOME/release"; then
            archive="OpenJDK${JDK_VERSION%%.*}U-jdk_x64_linux_hotspot_${JDK_VERSION/+/_}.tar.gz"
            url="https://github.com/adoptium/temurin${JDK_VERSION%%.*}-binaries/releases/download/jdk-${JDK_VERSION/+/%2B}/$archive"
            download_dir=$(mktemp -d)
            trap 'rm -rf "$download_dir"' EXIT
            curl --fail --location --retry 3 --output "$download_dir/$archive" "$url"
            curl --fail --location --retry 3 --output "$download_dir/$archive.sha256.txt" "$url.sha256.txt"
            (cd "$download_dir" && sha256sum --check "$archive.sha256.txt")
            rm -rf "$JAVA_HOME"
            mkdir -p "$JAVA_HOME"
            tar -xzf "$download_dir/$archive" -C "$JAVA_HOME" --strip-components=1
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$NX_CLOUD_ENV"
          echo "PATH=$PATH" >> "$NX_CLOUD_ENV"
          java -version
          # Fill the Gradle wrapper cache on a miss: its post step would otherwise store an empty
          # entry whenever no Gradle task ran on this agent.
          for attempt in 1 2 3; do
            ./gradlew --version && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/install-node-modules/main.yaml'
  # No graph prewarm: Nx Cloud restores the workspace data (project graph and @nx/gradle report)
  # that master last uploaded, and @nx/gradle only reruns Gradle when its build-file hash differs.

launch-templates:
  linux-medium-plus-js:
    resource-class: 'docker_linux_amd64/medium+'
    image: 'ubuntu22.04-node20.19-v3'
    env: *common-env
    init-steps: *common-init-steps
  linux-large-plus-js:
    resource-class: 'docker_linux_amd64/large+'
    image: 'ubuntu22.04-node20.19-v3'
    no-output-timeout: '30m'
    env: *common-env
    init-steps: *common-init-steps

common-env: &common-env
  NX_VERBOSE_LOGGING: true
  NX_PLUGIN_NO_TIMEOUTS: true
  # Record and hash tasks with Nx Cloud I/O snapshots (ultracache).
  NX_CLOUD_USE_ULTRACACHE: 'true'
common-init-steps: &common-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/checkout/main.yaml'
  - group-name: Restore Caches
    steps:
      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml'
          paths: 'node_modules'
          base-branch: 'master'
      # Gradle tasks otherwise download the wrapper distribution from services.gradle.org on every
      # agent, and fail when that download times out.
      - name: Restore Gradle Wrapper Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'gradle/wrapper/gradle-wrapper.properties|"gradle-wrapper-dists"'
          paths: '~/.gradle/wrapper/dists'
          base-branch: 'master'
      - name: Restore Browser Binary Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"'
          paths: |
            '../.cache/Cypress'
          base-branch: 'master'
  # apt and yarn write to different places, so the JDK setup runs next to the node_modules install.
  - group-name: Install Dependencies
    parallel: true
    steps:
      - name: Setup Java 21 and IntelliJ UI dependencies
        script: |
          sudo apt update
          sudo apt install -y openjdk-21-jdk xvfb ffmpeg fonts-dejavu-core libasound2 libnss3 libxkbfile1 libx11-6 libxi6 libxtst6 libxrender1 libxrandr2 libglib2.0-0 libdbus-1-3 libgbm1
          sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$NX_CLOUD_ENV"
          java -version
          # Fill the Gradle wrapper cache on a miss: its post step would otherwise store an empty
          # entry whenever no Gradle task ran on this agent.
          for attempt in 1 2 3; do
            ./gradlew --version && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/install-node-modules/main.yaml'
  # No graph prewarm: Nx Cloud restores the workspace data (project graph and @nx/gradle report)
  # that master last uploaded, and @nx/gradle only reruns Gradle when its build-file hash differs.

launch-templates:
  linux-medium-plus-js:
    resource-class: 'docker_linux_amd64/medium+'
    image: 'ubuntu22.04-node20.19-v3'
    env: *common-env
    init-steps: *common-init-steps
  linux-large-plus-js:
    resource-class: 'docker_linux_amd64/large+'
    image: 'ubuntu22.04-node20.19-v3'
    no-output-timeout: '30m'
    env: *common-env
    init-steps: *common-init-steps

common-env: &common-env
  NX_VERBOSE_LOGGING: true
  NX_PLUGIN_NO_TIMEOUTS: true
  # Record and hash tasks with Nx Cloud I/O snapshots (ultracache).
  NX_CLOUD_USE_ULTRACACHE: 'true'
common-init-steps: &common-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/checkout/main.yaml'
  - group-name: Restore Caches
    steps:
      - name: Restore Node Modules Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml'
          paths: 'node_modules'
          base-branch: 'master'
      - name: Restore Browser Binary Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: 'package-lock.json|yarn.lock|pnpm-lock.yaml|"browsers"'
          paths: |
            '../.cache/Cypress'
          base-branch: 'master'
      - name: Restore Java 21 Cache
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/cache/main.yaml'
        inputs:
          key: '"temurin-21.0.13+9-linux-x64"'
          paths: '~/.cache/temurin-21.0.13+9'
          base-branch: 'master'
  # The JDK is a pinned, cached tarball rather than an apt package: apt mirrors are at times slow enough
  # to stretch this step to minutes. It still runs next to the node_modules install.
  - group-name: Install Dependencies
    parallel: true
    steps:
      - name: Setup Java 21 and IntelliJ UI dependencies
        script: |
          set -euo pipefail
          export JAVA_HOME="$HOME/.cache/temurin-21.0.13+9"
          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            download_dir=$(mktemp -d)
            trap 'rm -rf "$download_dir"' EXIT
            curl --fail --location --retry 3 --output "$download_dir/jdk.tar.gz" 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz'
            echo "d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c  $download_dir/jdk.tar.gz" | sha256sum --check
            mkdir -p "$download_dir/jdk" "$(dirname "$JAVA_HOME")"
            tar -xzf "$download_dir/jdk.tar.gz" -C "$download_dir/jdk" --strip-components=1
            rm -rf "$JAVA_HOME"
            mv "$download_dir/jdk" "$JAVA_HOME"
          fi
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$NX_CLOUD_ENV"
          echo "PATH=$PATH" >> "$NX_CLOUD_ENV"
          java -version

          # The agent image already ships these; apt only runs if one is missing.
          missing_packages=()
          for package in xvfb ffmpeg fonts-dejavu-core libasound2 libnss3 libxkbfile1 libx11-6 libxi6 libxtst6 libxrender1 libxrandr2 libglib2.0-0 libdbus-1-3 libgbm1; do
            if [ "$(dpkg -s "$package" 2>/dev/null | sed -n 's/^Status: //p')" != 'install ok installed' ]; then
              missing_packages+=("$package")
            fi
          done
          if [ "${#missing_packages[@]}" -gt 0 ]; then
            sudo apt update
            sudo apt install -y "${missing_packages[@]}"
          fi
      - name: Install Node Modules
        uses: 'nrwl/nx-cloud-workflows/v4/workflow-steps/install-node-modules/main.yaml'
  # No graph prewarm: Nx Cloud restores the workspace data (project graph and @nx/gradle report)
  # that master last uploaded, and @nx/gradle only reruns Gradle when its build-file hash differs.

launch-templates:
  linux-medium-plus-js:
    resource-class: 'docker_linux_amd64/medium+'
    image: 'ubuntu22.04-node20.19-v3'
    env: *common-env
    init-steps: *common-init-steps
  linux-large-plus-js:
    resource-class: 'docker_linux_amd64/large+'
    image: 'ubuntu22.04-node20.19-v3'
    no-output-timeout: '30m'
    env: *common-env
    init-steps: *common-init-steps

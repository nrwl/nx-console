# Same-repository pull requests and pushes to master run on Nx Cloud CI (.nx/workflows/ci.yaml),
# which never runs pull requests from forks. This workflow covers those. Forks get no secrets, so
# it runs without an Nx Cloud token: no remote cache, no Nx Agents.
name: CI Checks (forks)
on:
  pull_request:

env:
  NODE_VERSION: 24
  JAVA_VERSION: 21
  NX_CLOUD_NO_TIMEOUTS: true
  NX_PLUGIN_NO_TIMEOUTS: true

jobs:
  main-linux:
    name: Main Linux (fork)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      NX_BATCH_MODE: true
      NX_CI_EXECUTION_ENV: 'linux'
      NX_VERBOSE_LOGGING: true
      GIT_AUTHOR_EMAIL: test@test.com
      GIT_AUTHOR_NAME: Test
      GIT_COMMITTER_EMAIL: test@test.com
      GIT_COMMITTER_NAME: Test
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: 'master'

      - run: git branch --track master origin/master

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: yarn

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-home-cache-excludes: |
            caches/*/transforms

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - run: chrome --version

      - name: Install NPM dependencies
        run: yarn install --immutable

      - name: Setup Gradle Dependencies
        run: ./gradlew dependencies

      - name: Check formatting
        run: yarn nx format:check --verbose

      - name: Ensure the workspace configuration is in sync
        run: yarn nx sync:check

      - name: Check pinned dependency versions
        run: node tools/scripts/check-pinned-versions.js

      # - name: Run Nx Cloud conformance checks
      #   run: yarn nx-cloud record -- yarn nx-cloud conformance:check

      # todo(cammisuli): disable verifyPlugin for now as its constantly failing on CI
      # - run: yarn nx affected --targets=lint,test,build,e2e-ci,typecheck,verifyPlugin,telemetry-check --configuration=ci --exclude=nx-console --parallel=3
      - run: yarn nx affected --targets=lint,ktfmtCheck,test,build,e2e-ci,typecheck,telemetry-check,buildPlugin --configuration=ci --exclude=nx-console --parallel=3
        timeout-minutes: 60

      - name: Upload IntelliJ E2E evidence
        if: ${{ always() && hashFiles('dist/apps/intellij/e2e/**/result.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intellij-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/apps/intellij/e2e
          if-no-files-found: error
          retention-days: 14

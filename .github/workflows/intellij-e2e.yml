name: IntelliJ E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  NX_NO_CLOUD: true
  NX_DAEMON: false
  NX_PLUGIN_NO_TIMEOUTS: true
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=4 -Dorg.gradle.workers.max=2 -Dorg.gradle.priority=low

jobs:
  project-view:
    name: IntelliJ project view
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: yarn
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle
      - name: Limit Gradle memory and parallelism
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2g -XX:ActiveProcessorCount=4' 'kotlin.daemon.jvmargs=-Xmx1g' 'org.gradle.workers.max=2' 'org.gradle.priority=low' 'org.gradle.daemon.idletimeout=60000' >> "$HOME/.gradle/gradle.properties"
      - name: Install display and video dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Configure IntelliJ license
        env:
          IDEA_LICENSE_BASE64: ${{ secrets.IDEA_LICENSE_BASE64 }}
        run: |
          test -n "$IDEA_LICENSE_BASE64" || { echo 'Configure IDEA_LICENSE_BASE64 with an activated idea.key before running this workflow.'; exit 1; }
          umask 077
          printenv IDEA_LICENSE_BASE64 | base64 --decode > "$RUNNER_TEMP/idea.key"
      - name: Run IntelliJ E2E
        env:
          NX_INTELLIJ_LICENSE_FILE: ${{ runner.temp }}/idea.key
        run: yarn nx run intellij:e2e
      - name: Remove license file
        if: always()
        run: rm -f "$RUNNER_TEMP/idea.key"
      - name: Upload IntelliJ E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intellij-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/apps/intellij/e2e/*/*.mp4
            dist/apps/intellij/e2e/*/*.log
            dist/apps/intellij/e2e/*/*.xml
            dist/apps/intellij/e2e/*/*.json
            dist/apps/intellij/e2e/*/*.txt
            dist/apps/intellij/e2e/*/ui.html
          if-no-files-found: warn
          retention-days: 14
